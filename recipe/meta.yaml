{% set name = "xopt" %}
{% set version = "3.2.1" %}
{% set python_min = "3.11" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 3eba0a7575b7c63e22dc6b5b96eafbc99b8b7389405aed451e96151a2056804f

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
    - setuptools-scm
  run:
    - python >={{ python_min }}
    - numpy >=2.3
    - pyyaml
    - deap
    - pytorch
    - botorch >=0.17.0
    - gpytorch
    - pandas
    - pydantic >=2.12
    - orjson
    - matplotlib-base
    - gest-api >=0.2
    - scipy >=1.10.1

test:
  imports:
    - xopt
  requires:
    - {{ compiler('cxx') }}
    - pytest
    - mpi4py
    - dask
    - openssh
    - libensemble
  commands:
    - pytest --pyargs xopt.tests -v

about:
  home: https://github.com/xopt-org/{{ name }}
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE
  summary: Flexible optimization of arbitrary problems in Python.
  description: |
    Flexible optimization of arbitrary problems in Python.

extra:
  recipe-maintainers:
    - ChristopherMayes
    - Roussel-Ryan
    - pluflou
